[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[functions."auto-news-cron"]
  schedule = "*/30 * * * *"

[[redirects]]
  from = "/api/auto-news-trigger"
  to = "/.netlify/functions/auto-news-cron"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
